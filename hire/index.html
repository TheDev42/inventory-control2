<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hire</title>
  <meta name="description" content="Browse the hire stock and build a flight case of the kit you need.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 9v14M11 9v14M15 9v14M19 9v14M23 9v14M9 9v14' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="#/" id="brand-link">
        <img class="brand-logo" id="brand-logo" src="" alt="" hidden>
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <span id="brand-name">Hire</span>
      </a>
      <form class="top-search" id="top-search" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="top-search-input" placeholder="Search the catalogue…" aria-label="Search the catalogue">
      </form>
      <nav class="top-nav">
        <a href="#/">Browse</a>
        <a href="#/stock">Stock list</a>
        <a class="case-link" href="#/case" id="case-link">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 12h18"/></svg>
          <span>Flight case</span><span class="count" id="case-count" hidden>0</span>
        </a>
      </nav>
    </div>
    <div class="wrap booking-bar" id="booking-bar" hidden></div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <div class="wrap" id="foot-inner"></div>
  </footer>

  <div class="modal-host" id="modal-host" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
